<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Animated command pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="210" rx="16" fill="#0F172A"/>
<text x="450" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Every command travels the same path</text>
<line x1="195" y1="90" x2="705" y2="90" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="25" y="55" width="170" height="70" rx="14" fill="#6366F1"/><text x="110" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">INPUT</text><text x="110" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E0E7FF" text-anchor="middle">ear.py / UI / API</text><animate attributeName="opacity" values="1;0.65;1;1;1" keyTimes="0;0.05;0.15;0.95;1" dur="5s" repeatCount="indefinite"/></g><g><rect x="250" y="55" width="170" height="70" rx="14" fill="#8B5CF6"/><text x="335" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">BRAIN</text><text x="335" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E0E7FF" text-anchor="middle">brain.py + LLM</text><animate attributeName="opacity" values="1;0.65;1;1;1" keyTimes="0;0.25;0.35;0.95;1" dur="5s" repeatCount="indefinite"/></g><g><rect x="480" y="55" width="170" height="70" rx="14" fill="#0EA5E9"/><text x="565" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">SKILLS</text><text x="565" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E0E7FF" text-anchor="middle">14 skill modules</text><animate attributeName="opacity" values="1;0.65;1;1;1" keyTimes="0;0.45;0.55;0.95;1" dur="5s" repeatCount="indefinite"/></g><g><rect x="705" y="55" width="170" height="70" rx="14" fill="#10B981"/><text x="790" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">OUTPUT</text><text x="790" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E0E7FF" text-anchor="middle">voice.py / web / API</text><animate attributeName="opacity" values="1;0.65;1;1;1" keyTimes="0;0.65;0.75;0.95;1" dur="5s" repeatCount="indefinite"/></g>
<circle r="8" fill="#FDE68A"><animateMotion dur="5s" repeatCount="indefinite" path="M 110,90 L 790,90"/><animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/></circle>
<circle r="14" fill="#FDE68A" opacity="0.25"><animateMotion dur="5s" repeatCount="indefinite" path="M 110,90 L 790,90"/></circle>
<line x1="450" y1="125" x2="450" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="320" y="160" width="260" height="32" rx="16" fill="#F59E0B"/>
<text x="450" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle">LOGS + MongoDB memory</text>
</svg>