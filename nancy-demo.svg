<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Animated demo of Nancy handling voice commands" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="c0"><rect x="40" y="90" width="0" height="26"><animate attributeName="width" values="0;0;215;215;0" keyTimes="0;0.0312;0.1013;0.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="40" y="150" width="0" height="26"><animate attributeName="width" values="0;0;199;199;0" keyTimes="0;0.2500;0.3200;0.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c4"><rect x="40" y="210" width="0" height="26"><animate attributeName="width" values="0;0;248;248;0" keyTimes="0;0.5000;0.5700;0.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c6"><rect x="40" y="270" width="0" height="26"><animate attributeName="width" values="0;0;141;141;0" keyTimes="0;0.7500;0.8200;0.96;1" dur="16s" repeatCount="indefinite"/></rect></clipPath></defs>
<rect width="900" height="370" rx="14" fill="#0B1220"/>
<rect width="900" height="40" rx="14" fill="#1E293B"/><rect y="20" width="900" height="20" fill="#1E293B"/>
<circle cx="24" cy="20" r="6" fill="#F87171"/><circle cx="46" cy="20" r="6" fill="#FBBF24"/><circle cx="68" cy="20" r="6" fill="#4ADE80"/>
<text x="450" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">nancy@assistant  -  live demo</text>
<text x="40" y="76" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#64748B">Nancy Voice Assistant v2.5 ready. Listening...</text>
<text x="40" y="108" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#67E8F9" clip-path="url(#c0)">> Hey Nancy, open notepad</text><text x="40" y="138" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#86EFAC" opacity="0">Nancy: Opening notepad.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1375;0.1675;0.96;1" dur="16s" repeatCount="indefinite"/></text><text x="40" y="168" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#67E8F9" clip-path="url(#c2)">> search latest AI news</text><text x="40" y="198" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#86EFAC" opacity="0">Nancy: Here are the top results (shown as cards).<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3625;0.3925;0.96;1" dur="16s" repeatCount="indefinite"/></text><text x="40" y="228" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#67E8F9" clip-path="url(#c4)">> what is the battery status?</text><text x="40" y="258" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#86EFAC" opacity="0">Nancy: Battery is charged and plugged in.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6125;0.6425;0.96;1" dur="16s" repeatCount="indefinite"/></text><text x="40" y="288" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#67E8F9" clip-path="url(#c6)">> lock my screen</text><text x="40" y="318" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#86EFAC" opacity="0">Nancy: Locking the screen.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8375;0.8675;0.96;1" dur="16s" repeatCount="indefinite"/></text>
<rect x="40" y="334" width="9" height="18" fill="#E2E8F0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>